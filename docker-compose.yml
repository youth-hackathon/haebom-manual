# 앞단 서버:  docker compose up -d --build                      http://127.0.0.1:8770
# 저작 서버:  docker compose --profile author up -d --build     http://127.0.0.1:8780
#
# 두 서버 모두 artemis 서버(haebom-artemis, baseline)를 ARTEMIS_URL에서 찾는다. 기본값은 이 컴퓨터의 8765다.
services:
  front:
    build: .
    ports: ["127.0.0.1:8770:8770"]
    environment:
      ARTEMIS_URL: ${ARTEMIS_URL:-http://host.docker.internal:8765}
      RECORD_DIR: ${RECORD_DIR:-}
    volumes:
      - ./manuals:/manuals:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  # 저작 서버는 adb로 닿는 기기가 있어야 한다. 컨테이너 안에서는 네트워크로 닿는 기기만 쓸 수 있다
  # (device/의 Cuttlefish). 이 컴퓨터에 뜬 에뮬레이터로 저작할 때는 Docker 없이 python manual/author.py로 돌린다.
  author:
    profiles: ["author"]
    build: .
    command: ["python", "manual/author.py", "serve"]
    ports: ["127.0.0.1:8780:8780"]
    environment:
      ARTEMIS_URL: ${ARTEMIS_URL:-http://host.docker.internal:8765}
      DEVICE_SERIAL: ${DEVICE_SERIAL:-host.docker.internal:6520}
      APP_APK: /apk/app-debug.apk
    volumes:
      - ./manuals:/manuals
      - ./runs:/runs
      - ${APP_APK_DIR:-../haebom-app/app/build/outputs/apk/debug}:/apk:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
